[project]
name = "vankila"
version = "0.1.0"
description = "Jail your coding agents in micro-VMs: controlled egress, hardened registries, secrets injected at the boundary."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vankila = "vankila.cli:main"
vk = "vankila.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vankila"]
